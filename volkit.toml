# volkit configuration.
#
# Replaces the old `config` file, which hard-coded
#   FILE_PATH=/home/colin/Desktop/vol/files/
# so the tool only ran on one machine. Paths here are relative to this file.

[data]
workbook = "files/vol_marks.xlsx"

[daily]
horizon_years = 1.0
cut = "NY"

[server]
host = "127.0.0.1"
port = 8765

# Extra holiday dates are no longer a file: they are the workbook's HOLIDAYS
# tab, read with the marks they move the expiries of.  The peg bands and the
# kACE pillars are the PEG_BANDS and KACE_SPREADS tabs of the same workbook.
