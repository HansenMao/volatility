# volkit startup settings.
#
# Read when volkit is started with NO command line of its own -- which is what
# double-clicking the executable does.  Anything typed at a prompt means this
# file is not read at all, so a shortcut and a terminal never disagree about
# half a setting.  "volkit.exe --no-config" skips it; "volkit.exe --config
# other.cfg" reads a different one.
#
# One setting a line, "name = value".  The value is the rest of the line, so a
# path with spaces in it needs no quotes.  A "#" starts a comment.  A setting
# whose value is true/yes/on becomes a switch; false/no/off leaves it out.
# A setting may repeat -- two enable-tab lines turn on two screens.
#
# Every name here is an option of the command below it: run "volkit.exe
# serve --help" to see the full list.  A name that is not one of them is
# reported by name and stops the program, rather than being ignored.

# What to run.  "serve" is the web interface; anything else the command line
# accepts works too, e.g. "command = analysis EURJPY".
command = serve

# ---------------------------------------------------------------------------
# Everything below is commented out and shows the default.  Uncomment a line
# to change it.
# ---------------------------------------------------------------------------

# The market data workbook.  Relative paths are resolved beside the exe.
# workbook = vol_marks.xlsx

# Spot and forward points.  Needed for carry, for indication pricing, and to
# place a managed band -- a band is an absolute price range and the surface
# works in strike over forward.
# feed = market_feed.csv

# The historical workbook behind the analysis and monitor screens.  Not loaded
# unless it is named: the shipped sample in samples/ is synthetic, and made-up
# numbers on a screen nobody asked for is the same failure as a silent zero.
# history = vol_history.xlsx

# Marks saved from a previous session, put back on the book at startup.  The
# workbook itself is never written to, so this is where yesterday's marking
# lives.  Written by "Save marks" on the marking screen, or by
# "volkit.exe session vol_session.json".
# session = vol_session.json

# The knowledge bank the market-maker screen quotes widths from.
# knowledge = vol_knowledge.json

# The desk agent's observation archive -- every broker quote, printed trade
# and price this desk has kept -- and the folders its card may read.  The
# folders are named here rather than typed into the page on purpose: a path a
# web page can name is a path anything reaching that page can read.
# archive = mm_archive.jsonl
# chats = chats
sdr = sdr
# ingest-state = mm_ingest.json
#
# The proxy the DTCC download goes out through.  Left out, the one named in
# https_proxy / HTTP_PROXY is used; a failure says which proxy refused.
# proxy = http://desk-proxy:8080

# The kACE feed (the kACE feed tab on the Vol marking screen, and "volkit
# kace").  The spread table names the pillars posted per pair and the ATM
# width at each; the username and password go into the message header.
# Leave the user out and the tab shows the pillar table but builds no
# message.  VOLKIT_KACE_USER / VOLKIT_KACE_PASSWORD in the environment are
# read when these are not set.
# kace-spreads = other_marks.xlsx   # a workbook whose KACE_SPREADS tab to use
#                                   # instead of the marks workbook's own
# kace-user = feeuser
# kace-password = secret
# kace-scenario = Xyz          # what the scenario box on the tab starts as
#
# Where a post goes: the address the XML poster page itself posts to.  With
# it set, the tab gains Post feed / Post clear and "volkit kace --post"
# works; without it the message can be copied and downloaded, not posted.
# The post goes straight to the host through no proxy.  An internal https
# certificate the machine does not trust needs kace-ca (the desk's CA
# bundle) or kace-insecure; every post is recorded in kace-log.
kace-url = https://pfcshkwapp01:8500/pricing
# kace-ca = C:\desk\ca.pem
# kace-insecure = false
# kace-log = kace_posts.jsonl

# Re-read the market feed whenever it is written.  Off unless this is set;
# the value is how often to look, in seconds.  The pricing tab has the same
# switch, so this only sets how it starts.  Everything it re-reads is
# reported on the page.
#
# Only the feed: the workbook and the historical sheet are deliberately not
# watched, because reloading the workbook discards every mark the session has
# made.  Those stay on their own buttons.
# auto-reload = 30

# Where to listen, and whether to open a browser.
# host = 127.0.0.1
# port = 8765
# no-browser = false

# Screens this build hides.  One line each; a name this build does not have at
# all is refused by name rather than ignored.  Run "volkit.exe --help" to see
# which, if any, are hidden.
# enable-tab = analysis
# enable-tab = mm

# Valuation time, for reproducing a past run.  Leave it out to use now.
# asof = 2024-02-28 12:00
