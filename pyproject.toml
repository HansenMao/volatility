[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volkit"
version = "2.0.0"
description = "FX volatility surface modelling: ATM term structure, events, SABR/SVI smiles, crosses"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Richer statutory calendars than the built-in rules. Everything works without it.
calendars = ["holidays>=0.40"]

[project.scripts]
volkit = "volkit.cli:main"

[tool.setuptools.packages.find]
include = ["volkit*"]

[tool.setuptools.package-data]
volkit = ["web/*.html"]
