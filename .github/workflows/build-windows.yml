name: build-windows

# Builds volkit.exe on a hosted Windows runner, so a Windows machine is not
# needed. PyInstaller cannot cross-compile: it bundles the host interpreter
# and host-compiled extension modules, so the build must happen on Windows.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # tzdata is not optional on Windows - there is no system IANA database.
          pip install tzdata pyinstaller

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Build
        run: python -m PyInstaller volkit.spec --noconfirm --clean

      - name: Stage data files beside the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/volkit | Out-Null
          Copy-Item files/vol_marks.xlsx, files/market_feed.csv, files/bands.csv,
                    files/holiday_overrides.csv, USER_MANUAL.md dist/volkit/ -ErrorAction SilentlyContinue

      - name: Smoke-test the executable
        run: |
          dist\volkit\volkit.exe check -w files\vol_marks.xlsx
          dist\volkit\volkit.exe tenors USDJPY --asof "2024-02-28 12:00"

      - uses: actions/upload-artifact@v4
        with:
          name: volkit-windows
          path: dist/volkit/
