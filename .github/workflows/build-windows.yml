name: build-windows

# Builds volkit.exe on a hosted Windows runner, so a Windows machine is not
# needed. PyInstaller cannot cross-compile: it bundles the host interpreter
# and host-compiled extension modules, so the build must happen on Windows.
#
# The whole build is build_exe.py -- dependencies, tests, PyInstaller, staging
# the trader's data files and smoke-testing the result. Keeping the steps in
# the script rather than in this file is what makes a local Windows build and
# a CI build the same build.

on:
  workflow_dispatch:
    inputs:
      onefile:
        description: "Single self-extracting volkit.exe instead of a folder"
        type: boolean
        default: false
      exclude_tabs:
        description: "Screens to leave out, comma separated: pricing, marking, listed, analysis, mm"
        type: string
        default: ""
      hidden_tabs:
        description: "Screens to build but hide until volkit.exe --enable-tab NAME, comma separated"
        type: string
        default: ""
  push:
    tags: ["v*"]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: >-
          python build_exe.py --zip
          ${{ inputs.onefile && '--onefile' || '' }}
          ${{ inputs.exclude_tabs && format('--exclude-tab {0}', inputs.exclude_tabs) || '' }}
          ${{ inputs.hidden_tabs && format('--hidden-tab {0}', inputs.hidden_tabs) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: volkit-windows
          path: dist/volkit-windows.zip
