name: build-windows

# Builds volkit.exe on a hosted Windows runner, so a Windows machine is not
# needed. PyInstaller cannot cross-compile: it bundles the host interpreter
# and host-compiled extension modules, so the build must happen on Windows.
#
# The whole build is build_exe.py -- dependencies, PyInstaller, staging the
# trader's data files and smoke-testing the result. Keeping the steps in the
# script rather than in this file is what makes a local Windows build and a
# CI build the same build.
#
# What is *not* here any more is the test suite. It used to be step 3 of
# build_exe.py on this runner, which made every exe cost the suite: ninety
# minutes to be told a test was pinned to the wrong workbook. The suite now
# runs in test.yml, on Linux, one job per module, and this workflow calls it
# and will not build unless it is green -- so nothing ships untested, and a
# test failure is reported in minutes by the module it broke. The check that
# genuinely has to happen on Windows, running the exe that was just built and
# making it price something, is build_exe.py's own smoke step and still runs.

on:
  workflow_dispatch:
    inputs:
      onefile:
        description: "Single self-extracting volkit.exe instead of a folder"
        type: boolean
        default: false
      exclude_tabs:
        description: "Screens to leave out, comma separated: pricing, marking, listed, analysis, mm"
        type: string
        default: ""
      hidden_tabs:
        description: "Screens to build but hide until volkit.exe --enable-tab NAME, comma separated"
        type: string
        default: ""
  push:
    tags: ["v*"]

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --skip-tests because the tests job above just ran them on Linux. Every
      # other step build_exe.py does is still done here: the workbook check,
      # the preflight, PyInstaller, staging the data files beside the exe, and
      # the smoke test that runs the exe and prices with it.
      - name: Build
        run: >-
          python build_exe.py --zip --skip-tests
          ${{ inputs.onefile && '--onefile' || '' }}
          ${{ inputs.exclude_tabs && format('--exclude-tab {0}', inputs.exclude_tabs) || '' }}
          ${{ inputs.hidden_tabs && format('--hidden-tab {0}', inputs.hidden_tabs) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: volkit-windows
          path: dist/volkit-windows.zip
